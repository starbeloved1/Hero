gimbal_driver_node:
  ros__parameters:
    # 车上填写真实串口 /dev/ttyACM0；本地运行时改为 virtual
    port_name: virtual
    # 5 个 64B 分片共 320 个串口字节。115200 baud 的线速上限只有
    # 36 Hz，无法满足 50 Hz；需与下位机保持一致使用 1 Mbaud。
    baud_rate: 1000000
    enable_crc_check: true
    enable_fire: true
    command_flag: 5

    virtual_mode: 1
    # 己方颜色：0蓝色，1红色
    virtual_robot_color: 0
    
    state_topic: /hero/gimbal/state # pub
    control_topic: /hero/gimbal/control # sub
    gimbal_frame_id: gimbal_link
    state_publish_rate_hz: 200.0
    command_send_rate_hz: 200.0

    # mode4 反基地码流由本节点独占写入同一串口；完整包起始间隔必须严格大于 20 ms。
    antibase_packet_topic: /hero/aim/antibase/packets
    antibase_tx_status_topic: /hero/aim/antibase/tx_status
    antibase_min_packet_gap_ms: 21.0
    antibase_chunk_gap_ms: 2.0
    antibase_queue_depth: 64
