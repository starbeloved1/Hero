aim_normal_node:
  ros__parameters:
    enabled: true
    enable_fire: true

    armor_pose_topic: /hero/solver/armor_poses # sub
    gimbal_state_topic: /hero/gimbal/state # sub
    control_candidate_topic: /hero/aim/normalaim/controller # pub
    debug_topic: /hero/aim/normalaim/debug # pub
    target_frame_id: world

    # 相邻帧内距离小于此值，认为是同一目标
    keep_target_distance_m: 0.3
    # 最大丢失帧数
    max_lost_frames: 5

    # 大装甲板俯仰距离补偿
    large_armor_distance_factor: 1.2
    # 小角度连续变化启用平滑，超过阈值立即跟随
    yaw_previous_weight: 0.3
    pitch_previous_weight: 0.7
    yaw_jump_threshold_deg: 3.0
    pitch_jump_threshold_deg: 1.0
